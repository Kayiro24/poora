# Builds signed APKs and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Tags with a hyphen (v1.1.0-beta.1) are published as pre-releases.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. "upload")
#   ANDROID_KEY_PASSWORD      key password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          # Android versionCode must always increase; the run number does.
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          [[ "$VERSION" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      # Every release must be signed with the same key, or Android refuses to
      # install updates over the previous version. Never fall back to debug keys.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v — see the comment at the top of release.yml"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs
        run: |
          ARGS="--release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }} --dart-define=APP_VERSION=${{ steps.version.outputs.name }}"
          flutter build apk $ARGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/poora-${{ steps.version.outputs.name }}-universal.apk"
          flutter build apk $ARGS --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/poora-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - name: Verify release signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            CERT=$("$APKSIGNER" verify --print-certs "$apk")
            if echo "$CERT" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is debug-signed"; exit 1
            fi
          done
          "$APKSIGNER" verify --print-certs "dist/poora-${{ steps.version.outputs.name }}-universal.apk" | grep -E "SHA-256 digest" | head -1

      - name: Checksums
        run: cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Poora ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            **Which file do I download?**
            - `poora-${{ steps.version.outputs.name }}-universal.apk` — works on every Android phone (recommended).
            - `…-arm64-v8a.apk` — smaller, for almost all phones from 2017 on.
            - `…-armeabi-v7a.apk` — older 32-bit phones. `…-x86_64.apk` — emulators / Chromebooks.

            Pick one variant and stay with it for updates. Android 7.0+ required.
            Install: open the APK on your phone and allow "Install unknown apps" for your browser or file manager when asked.
            Verify a download: compare its SHA-256 with `SHA256SUMS.txt`.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload.jks android/key.properties
